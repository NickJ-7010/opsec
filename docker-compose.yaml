services:
  opsec-repo:
    build:
      context: .
      args:
        REPO_ORIGIN: ${REPO_ORIGIN}
        REPO_CODENAMES: ${REPO_CODENAMES:-trixie bookworm}
        REPO_ARCH: ${REPO_ARCH}
        GPG_PRIVATE_KEY_B64: ${GPG_PRIVATE_KEY_B64}
        GPG_PASSPHRASE: ${GPG_PASSPHRASE}
        GNUPGHOME: ${GNUPGHOME}
    container_name: opsec-repo
    ports:
      - "8080:8080"
