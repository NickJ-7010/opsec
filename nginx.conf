server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # The apt repository signing key, served from the repo root and at its
    # conventional path.
    location = / {
        default_type application/pgp-keys;
        add_header Cache-Control "public, max-age=3600";
        try_files /repo-key.gpg =404;
    }

    location = /repo-key.gpg {
        default_type application/pgp-keys;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        default_type application/pgp-keys;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }

    # Prevent APT clients from caching stale Release/InRelease metadata
    location ~ ^/dists/.*(Release|InRelease|Packages|Packages\.gz|Packages\.xz)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Block access to internal reprepro metadata and configuration
    location ~ ^/(db|conf)(/|$) {
        deny all;
        return 404;
    }
}
